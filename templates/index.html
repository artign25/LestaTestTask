<!DOCTYPE html>
<html>
<head>
    <title>Анализ TF-IDF (FastAPI)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .upload-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>Анализ TF-IDF слов в тексте</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="upload-form">
        <form method="POST" action="/analyze" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Выберите текстовый файл (.txt):</label>
                <input type="file" name="file" id="file" accept=".txt" required>
            </div>
            <button type="submit">Анализировать</button>
        </form>
    </div>
</body>
</html>
